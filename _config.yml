# Site settings
title: Can Kayalan
description: Projects and things I've made
url: https://willguido.github.io
github_username: willguido
search: true

# Theme: https://mmistakes.github.io/minimal-mistakes/
remote_theme: mmistakes/minimal-mistakes@4.28.1
# Other colour options: default, contrast, dark, dirt, mint, neon, plum, sunrise, aqua
minimal_mistakes_skin: air

markdown: kramdown
permalink: /:categories/:title/

plugins:
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-sitemap

author:
  name: Can Kayalan
  bio: "Placeholder: a sentence or two about you."
  links:
    - label: GitHub
      icon: fab fa-fw fa-github
      url: https://github.com/willguido

footer:
  links:
    - label: GitHub
      icon: fab fa-fw fa-github
      url: https://github.com/willguido

atom_feed:
  hide: true

exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
